[tool.pytest.ini_options]
# pytest-homeassistant's configuration (its README at 2026.11.0). No cache folder in
# the tree: an untracked .pytest_cache would leave the development checkout dirty, and
# the checks and the cleanup that run there refuse a dirty one.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Home Assistant installs its httpx alias before respx is imported.
addopts = "-p no:respx -p no:cacheprovider"
pythonpath = ["."]
testpaths = ["tests"]
